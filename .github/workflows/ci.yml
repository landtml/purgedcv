name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

  # The declared dependency floors are only installable on 3.10/3.11 -- numpy
  # 1.24, pandas 2.0 and scikit-learn 1.3 all ship cp311 wheels at the newest.
  # Without this job the floors in pyproject.toml are never exercised.
  floors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install oldest supported dependencies
        run: |
          pip install -e ".[dev]"
          pip install "numpy==1.24.*" "pandas==2.0.*" "scikit-learn==1.3.*"

      - name: Show resolved versions
        run: pip list | grep -E "numpy|pandas|scikit-learn"

      - name: Run test suite
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify the sdist carries the docs and the type marker
        run: |
          tar tzf dist/*.tar.gz | grep -q "PROOF.md"
          tar tzf dist/*.tar.gz | grep -q "verify_leakage.py"
          python -m zipfile -l dist/*.whl | grep -q "py.typed"
