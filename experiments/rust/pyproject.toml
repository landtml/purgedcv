[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "purgedcv-rs"
description = "Experimental Rust engine for purgedcv (drop-in CombinatorialPurgedCV)."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["purgedcv", "numpy>=1.24"]
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "purgedcv_rs._engine"
features = ["pyo3/extension-module"]
