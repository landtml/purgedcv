[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purgedcv-backtest"
version = "0.0.2"
description = "Overfitting-aware backtest statistics built on purgedcv: DSR, PBO, MinTRL and trial accounting."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "purgedcv"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
